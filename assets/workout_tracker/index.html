<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151719">
    <title>Workout Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <div class="view" id="main-view">
      <div class="scroll">
      <header class="page-header">
        <h1>Workout Tracker</h1>
      </header>

      <div class="tabs" role="tablist" aria-label="Workout tracker pages">
        <button
          class="tab is-active"
          id="workouts-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="workouts-panel"
          tabindex="0"
        >
          Workouts
        </button>
        <button
          class="tab"
          id="history-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="history-panel"
          tabindex="-1"
        >
          History
        </button>
        <button
          class="tab"
          id="progress-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="progress-panel"
          tabindex="-1"
        >
          Progress
        </button>
        <button class="tab settings-tab" id="settings-tab" type="button" role="tab" aria-label="Settings" title="Settings" aria-selected="false" aria-controls="settings-panel" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.5a2 2 0 0 1-1 1.74l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.73v-.5a2 2 0 0 1 1-1.74l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <section
        class="page-content"
        id="workouts-panel"
        role="tabpanel"
        aria-labelledby="workouts-tab"
        tabindex="0"
      >
        <p class="empty-message" id="workouts-message" hidden></p>
        <ul class="workout-list" id="workout-list"></ul>
      </section>

      <section
        class="page-content"
        id="history-panel"
        role="tabpanel"
        aria-labelledby="history-tab"
        tabindex="0"
        hidden
      >
        <p class="empty-message" id="history-message" hidden></p>
        <ul class="workout-list" id="history-list"></ul>
      </section>

      <section
        class="page-content"
        id="progress-panel"
        role="tabpanel"
        aria-labelledby="progress-tab"
        tabindex="0"
        hidden
      >
        <p class="empty-message" id="progress-message" hidden></p>
        <ul class="workout-list" id="progress-list"></ul>
      </section>

      <section class="page-content" id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" tabindex="0" hidden>
        <label class="field">
          <span>Weight units</span>
          <select id="weight-unit">
            <option value="lb">Pounds (lb)</option>
            <option value="kg">Kilograms (kg)</option>
          </select>
        </label>
        <label class="field">
          <span id="bodyweight-label">Bodyweight (lb)</span>
          <input id="bodyweight" type="number" min="0" step="any" inputmode="decimal">
        </label>
        <p class="form-error" id="settings-error" role="alert" hidden></p>
        <section class="settings-data" aria-labelledby="settings-workouts-title">
          <h2 id="settings-workouts-title">Workouts</h2>
          <div class="file-actions" id="workouts-file-actions">
            <button type="button" data-action="export" data-store="workouts">Export</button>
            <button type="button" data-action="import" data-store="workouts">Import</button>
            <button type="button" data-action="clear" data-store="workouts">Clear</button>
          </div>
          <p class="empty-message" id="workouts-status" role="status" hidden></p>
        </section>
        <section class="settings-data" aria-labelledby="settings-history-title">
          <h2 id="settings-history-title">History</h2>
          <div class="file-actions" id="history-file-actions">
            <button type="button" data-action="export" data-store="history">Export</button>
            <button type="button" data-action="import" data-store="history">Import</button>
            <button type="button" data-action="clear" data-store="history">Clear</button>
          </div>
          <p class="empty-message" id="history-status" role="status" hidden></p>
        </section>
      </section>
      </div>

      <footer class="main-footer" id="main-footer">
        <button class="fab" id="add-workout-button" type="button" aria-label="Create new workout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </footer>
      </div>

      <div class="view" id="create-view" hidden>
        <div class="scroll">
          <header class="page-header">
            <button class="back-button" id="back-button" type="button">&larr; Back</button>
            <h1 id="create-title">Create new workout</h1>
          </header>

          <form id="workout-form" novalidate>
            <label class="field">
              <span>Workout name</span>
              <input type="text" id="workout-name" autocomplete="off" maxlength="80">
            </label>

            <ol class="exercise-list" id="exercise-list"></ol>

            <p class="form-error" id="form-error" role="alert" hidden></p>
          </form>
        </div>

        <button class="fab" id="save-button" type="button" aria-label="Save workout">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3h11l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <path d="M8 3v5h8V3M7 21v-7h10v7"/>
          </svg>
        </button>
      </div>

      <div class="view" id="progress-view" hidden>
        <div class="scroll">
          <header class="page-header">
            <button class="back-button" id="progress-back-button" type="button">&larr; Back</button>
            <h1 id="progress-title"></h1>
          </header>
          <label class="field" id="progress-metric-field">
            <span>Value</span>
            <select id="progress-metric">
              <option value="reps">Reps</option>
              <option value="weight">Weight</option>
              <option value="effort">Effort (weight &times; reps)</option>
            </select>
          </label>
          <label class="checkbox-field" id="progress-bodyweight-field" hidden>
            <input id="progress-bodyweight" type="checkbox">
            <span>Bodyweight Exercise</span>
          </label>
          <label class="field" id="progress-proportion-field" hidden>
            <span>Bodyweight Proportion</span>
            <input id="progress-proportion" type="number" min="0" step="any" inputmode="decimal" value="1.0">
          </label>
          <p class="form-error" id="progress-error" role="alert" hidden></p>
          <div class="chart" id="progress-chart"></div>
          <ul class="chart-legend" id="progress-legend"></ul>
        </div>
      </div>

      <div class="view" id="details-view" hidden>
        <div class="scroll">
          <header class="page-header">
            <button class="back-button" id="details-back-button" type="button">&larr; Back</button>
            <h1 id="details-title"></h1>
            <p class="details-meta" id="details-meta"></p>
          </header>
          <ol class="exercise-list" id="details-list"></ol>
        </div>
      </div>

      <div class="view" id="workout-view" hidden>
        <div class="scroll workout-scroll">
          <header class="page-header">
            <button class="back-button" id="workout-back-button" type="button">&larr; Back</button>
            <h1 id="workout-title"></h1>
            <p class="form-error" id="workout-error" role="alert" hidden></p>
          </header>

          <div class="exercise-stack">
            <section class="exercise-slot" id="slot-previous" aria-label="Previous exercise"></section>
            <section class="exercise-slot is-current" id="slot-current" aria-label="Current exercise"></section>
            <section class="exercise-slot" id="slot-next" aria-label="Next exercise"></section>
          </div>
        </div>

        <button class="fab" id="pause-button" type="button" aria-label="Pause workout">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="icon-pause" d="M9 5v14M15 5v14"/>
            <path class="icon-play" d="M8 5l11 7-11 7z"/>
          </svg>
        </button>
      </div>

      <div
        class="view confirm-view"
        id="confirm-view"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-text"
        hidden
      >
        <div class="confirm-card">
          <h2 id="confirm-title">Are you sure?</h2>
          <p id="confirm-text"></p>
          <div class="confirm-actions">
            <button type="button" id="confirm-no">No</button>
            <button type="button" id="confirm-yes" class="confirm-yes">Yes</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
